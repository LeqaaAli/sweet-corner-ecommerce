<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SWEET CORNER</title>
    <link rel="stylesheet" href="homeStyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<script>
    function toggleAuthNav() {
        const user = JSON.parse(localStorage.getItem('sweetCurrentUser'));
        document.getElementById('nav-guest').style.display = user ? 'none' : 'flex';
        document.getElementById('nav-user').style.display = user ? 'flex' : 'none';
        if (user) document.getElementById('user-display').textContent = ` ${user.name}`;
    }
    function logout() { localStorage.removeItem('sweetCurrentUser'); window.location.reload(); }
    // Run instantly on load
    toggleAuthNav();
</script>
<body>
    <header>
        <nav class="navbar">
            <div class="logo"> <span>🍓Sweet</span> Corner</div>
            <ul class="nav-links">
                <li><a href="home.html">🏠 Home</a></li>
                <li><a href="contact.html">📞 Contact Us</a></li>

                <li id="guest-nav" class="nav-auth-group">
                    <a href="signin.html">🔑 Sign In</a>
                    <a href="signup.html" class="nav-btn-signup">🧁 Sign Up</a>
                </li>
                <li id="user-nav" class="nav-user-info" style="display: none;">
                    <span class="nav-user-name" id="user-display"> User</span>
                    <button class="nav-btn-logout" id="logout-trigger">🚪 Logout</button>
                </li>

                <li><a href="cart.html" class="cart-icon">🛒 <span class="cart-count" id="cart-count">0</span></a></li>
            </ul>
        </nav>
    </header>
    <main class="auth-wrapper">
        <div class="auth-card">
            <h2 class="auth-title">Join the Sweetness 🧁</h2>
            <p class="auth-subtitle">Create your Sweet Corner account</p>
            <form id="signup-form" class="auth-form">
                <div class="form-group"><label for="signup-name">Full Name</label><input type="text" id="signup-name" required placeholder="Jane Doe"><span class="error-msg" id="name-error"></span></div>
                <div class="form-group"><label for="signup-email">Email Address</label><input type="email" id="signup-email" required placeholder="you@example.com"><span class="error-msg" id="email-error"></span></div>
                <div class="form-group"><label for="signup-password">Password</label><input type="password" id="signup-password" required placeholder="Min 6 characters"><span class="error-msg" id="pass-error"></span></div>
                <div class="form-group"><label for="signup-confirm">Confirm Password</label><input type="password" id="signup-confirm" required placeholder="Re-enter password"><span class="error-msg" id="confirm-error"></span></div>
                <button type="submit" class="auth-btn">Create Account ✨</button>
            </form>
            <p class="auth-footer">Already have an account? <a href="signin.html" class="auth-link">Sign In</a></p>
        </div>
    </main>
    <footer>
        <div class="footer-content"><p>&copy; 2026 Atlas Confections. Have questions? <a href="contact.html">Contact Our Team</a></p></div>
    </footer>
    <script>
        const form = document.getElementById('signup-form');
        const nameInput = document.getElementById('signup-name');
        const emailInput = document.getElementById('signup-email');
        const passInput = document.getElementById('signup-password');
        const confirmInput = document.getElementById('signup-confirm');
        const nameErr = document.getElementById('name-error');
        const emailErr = document.getElementById('email-error');
        const passErr = document.getElementById('pass-error');
        const confirmErr = document.getElementById('confirm-error');
        function clearErrors() { [nameErr, emailErr, passErr, confirmErr].forEach(el => el.textContent = ''); }
        form.addEventListener('submit', (e) => {
            e.preventDefault(); clearErrors(); let valid = true;
            const name = nameInput.value.trim(); const email = emailInput.value.trim(); const password = passInput.value; const confirm = confirmInput.value;
            if (!name) { nameErr.textContent = 'Full name is required'; valid = false; }
            else if (name.length < 2) { nameErr.textContent = 'Name must be at least 2 characters'; valid = false; }
            if (!email) { emailErr.textContent = 'Email is required'; valid = false; }
            else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { emailErr.textContent = 'Enter a valid email'; valid = false; }
            if (!password) { passErr.textContent = 'Password is required'; valid = false; }
            else if (password.length < 6) { passErr.textContent = 'Min 6 characters required'; valid = false; }
            if (password !== confirm) { confirmErr.textContent = 'Passwords do not match'; valid = false; }
            if (!valid) return;

            const users = JSON.parse(localStorage.getItem('sweetUsers')) || [];
            if (users.some(u => u.email === email)) {
                emailErr.textContent = 'This email is already registered. Please sign in instead.';
                return;
            }

            const newUser = { name, email, password, createdAt: new Date().toISOString() };
            users.push(newUser); localStorage.setItem('sweetUsers', JSON.stringify(users));
            localStorage.setItem('sweetCurrentUser', JSON.stringify({ name, email }));
            alert(`🎉 Welcome to Sweet Corner, ${name}! Account created successfully.`);
            window.location.href = 'home.html';
        });
        function toggleAuthNav() {
            const user = JSON.parse(localStorage.getItem('sweetCurrentUser')); const guestNav = document.getElementById('guest-nav'); const userNav = document.getElementById('user-nav'); const nameDisplay = document.getElementById('user-name-display');
            if (user) { guestNav.style.display = 'none'; userNav.style.display = 'flex'; nameDisplay.textContent = `👤 ${user.name}`; }
            else { guestNav.style.display = 'flex'; userNav.style.display = 'none'; }
        }
        function logout() { localStorage.removeItem('sweetCurrentUser'); window.location.reload(); }
        toggleAuthNav();
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const user = JSON.parse(localStorage.getItem('sweetCurrentUser'));
            const guestNav = document.getElementById('guest-nav');
            const userNav = document.getElementById('user-nav');
            const userDisplay = document.getElementById('user-display');
            const logoutBtn = document.getElementById('logout-trigger');

            if (user) {
                if (guestNav) guestNav.style.display = 'none';
                if (userNav) {
                    userNav.style.display = 'flex';
                    userDisplay.textContent = `👤 ${user.name}`;
                }
            } else {
                if (guestNav) guestNav.style.display = 'flex';
                if (userNav) userNav.style.display = 'none';
            }

            if (logoutBtn) {
                logoutBtn.addEventListener('click', function() {
                    localStorage.removeItem('sweetCurrentUser');
                    window.location.href = 'home.html';
                });
            }
        });
    </script>
</body>
</html>
