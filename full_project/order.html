<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order - SWEET CORNER</title>
    <link rel="stylesheet" href="homeStyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<script>
    function toggleAuthNav() {
        const user = JSON.parse(localStorage.getItem('sweetCurrentUser'));
        document.getElementById('nav-guest').style.display = user ? 'none' : 'flex';
        document.getElementById('nav-user').style.display = user ? 'flex' : 'none';
        if (user) document.getElementById('user-display').textContent = `👤 ${user.name}`;
    }
    function logout() { localStorage.removeItem('sweetCurrentUser'); window.location.reload(); }
    // Run instantly on load
    toggleAuthNav();
</script>
<body>
    <header>
        <nav class="navbar">
            <div class="logo"> <span>🍓Sweet</span> Corner</div>
            <ul class="nav-links">
                <li><a href="home.html">🏠 Home</a></li>
                <li><a href="contact.html">📞 Contact Us</a></li>

                <li id="guest-nav" class="nav-auth-group">
                    <a href="signin.html">🔑 Sign In</a>
                    <a href="signup.html" class="nav-btn-signup">🧁 Sign Up</a>
                </li>
                <li id="user-nav" class="nav-user-info" style="display: none;">
                    <span class="nav-user-name" id="user-display"> User</span>
                    <button class="nav-btn-logout" id="logout-trigger">🚪 Logout</button>
                </li>

                <li><a href="cart.html" class="cart-icon">🛒 <span class="cart-count" id="cart-count">0</span></a></li>
            </ul>
        </nav>
    </header>
    <main class="order-container">
        <h2 class="page-title">📦 Complete Your Order</h2>
        <div class="order-layout">
            <div class="order-form-section">
                <h3>Delivery Details</h3>
                <form id="order-form" class="order-form">
                    <div class="form-group"><label for="name">Full Name</label><input type="text" id="name" required placeholder="Enter your full name"></div>
                    <div class="form-group"><label for="phone">Phone Number</label><input type="tel" id="phone" required placeholder="e.g., 01012345678"></div>
                    <div class="form-group"><label for="address">Delivery Address</label><textarea id="address" rows="3" required placeholder="Street, Building, Floor, Apartment..."></textarea></div>
                    <div class="form-group"><label for="notes">Order Notes (Optional)</label><textarea id="notes" rows="2" placeholder="Special instructions, allergies, etc."></textarea></div>
                    <button type="submit" class="submit-order-btn">Confirm Order ✅</button>
                </form>
            </div>
            <div class="order-summary-section">
                <h3>🛒 Order Summary</h3>
                <div id="order-items-list"></div>
                <div class="order-total">Total: <span id="order-total-price">0</span> EGP</div>
            </div>
        </div>
    </main>
    <footer>
        <div class="footer-content"><p>&copy; 2026 Atlas Confections. Have questions? <a href="contact.html">Contact Our Team</a></p></div>
    </footer>
    <script>
        const getCurrentUser = () => JSON.parse(localStorage.getItem('sweetCurrentUser'));
        const getCartKey = () => getCurrentUser() ? `sweetCart_${getCurrentUser().email}` : 'sweetCart_guest';
        let cart = JSON.parse(localStorage.getItem(getCartKey())) || [];

        // 🛡️ ORDER GUARD
        if (!getCurrentUser()) {
            alert('🔒 Please sign in to place an order.');
            window.location.href = 'signin.html';
        }

        const cartCountEl = document.getElementById('cart-count');
        const orderItemsList = document.getElementById('order-items-list');
        const orderTotalPrice = document.getElementById('order-total-price');
        const orderForm = document.getElementById('order-form');

        function updateCartBadge() { const totalQty = cart.reduce((sum, item) => sum + item.qty, 0); if (cartCountEl) { cartCountEl.textContent = totalQty; cartCountEl.style.display = totalQty > 0 ? 'flex' : 'none'; } }
        function renderOrderSummary() {
            if (cart.length === 0) { orderItemsList.innerHTML = '<p style="color: var(--text-muted); text-align:center; padding: 20px;">No items in cart.</p>'; orderTotalPrice.textContent = '0'; return; }
            let total = 0; let html = '';
            cart.forEach(item => { total += item.price * item.qty; html += `<div class="order-item"><img src="${item.img}" alt="${item.name}" class="order-item-img"><span class="order-item-name">${item.name} × ${item.qty}</span><span class="order-item-price">${item.price * item.qty} EGP</span></div>`; });
            orderItemsList.innerHTML = html; orderTotalPrice.textContent = total;
        }
        orderForm.addEventListener('submit', function(e) {
            e.preventDefault();
            if (cart.length === 0) { alert('🍰 Your cart is empty!'); return; }
            alert(`✅ Order Placed Successfully!\n\nName: ${document.getElementById('name').value}\nPhone: ${document.getElementById('phone').value}\nTotal: ${orderTotalPrice.textContent} EGP\n\nWe'll contact you shortly! 💕`);
            localStorage.removeItem(getCartKey()); cart = [];
            renderOrderSummary(); updateCartBadge();
            setTimeout(() => window.location.href = 'home.html', 500);
        });
        function toggleAuthNav() {
            const user = getCurrentUser(); const guestNav = document.getElementById('guest-nav'); const userNav = document.getElementById('user-nav'); const nameDisplay = document.getElementById('user-name-display');
            if (user) { guestNav.style.display = 'none'; userNav.style.display = 'flex'; nameDisplay.textContent = `👤 ${user.name}`; }
            else { guestNav.style.display = 'flex'; userNav.style.display = 'none'; }
        }
        function logout() { localStorage.removeItem('sweetCurrentUser'); window.location.reload(); }
        renderOrderSummary(); updateCartBadge(); toggleAuthNav();
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const user = JSON.parse(localStorage.getItem('sweetCurrentUser'));
            const guestNav = document.getElementById('guest-nav');
            const userNav = document.getElementById('user-nav');
            const userDisplay = document.getElementById('user-display');
            const logoutBtn = document.getElementById('logout-trigger');

            if (user) {
                if (guestNav) guestNav.style.display = 'none';
                if (userNav) {
                    userNav.style.display = 'flex';
                    userDisplay.textContent = ` ${user.name}`;
                }
            } else {
                if (guestNav) guestNav.style.display = 'flex';
                if (userNav) userNav.style.display = 'none';
            }

            if (logoutBtn) {
                logoutBtn.addEventListener('click', function() {
                    localStorage.removeItem('sweetCurrentUser');
                    window.location.href = 'home.html';
                });
            }
        });
    </script>
</body>
</html>
