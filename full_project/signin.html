<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SWEET CORNER</title>
    <link rel="stylesheet" href="homeStyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<script>
    function toggleAuthNav() {
        const user = JSON.parse(localStorage.getItem('sweetCurrentUser'));
        document.getElementById('nav-guest').style.display = user ? 'none' : 'flex';
        document.getElementById('nav-user').style.display = user ? 'flex' : 'none';
        if (user) document.getElementById('user-display').textContent = `👤 ${user.name}`;
    }
    function logout() { localStorage.removeItem('sweetCurrentUser'); window.location.reload(); }
    // Run instantly on load
    toggleAuthNav();
</script>
<body>
    <header>
        <nav class="navbar">
            <div class="logo"> <span>🍓Sweet</span> Corner</div>
            <ul class="nav-links">
                <li><a href="home.html">🏠 Home</a></li>
                <li><a href="contact.html">📞 Contact Us</a></li>

                <li id="guest-nav" class="nav-auth-group">
                    <a href="signin.html">🔑 Sign In</a>
                    <a href="signup.html" class="nav-btn-signup">🧁 Sign Up</a>
                </li>
                <li id="user-nav" class="nav-user-info" style="display: none;">
                    <span class="nav-user-name" id="user-display"> User</span>
                    <button class="nav-btn-logout" id="logout-trigger">🚪 Logout</button>
                </li>

                <li><a href="cart.html" class="cart-icon">🛒 <span class="cart-count" id="cart-count">0</span></a></li>
            </ul>
        </nav>
    </header>
    <main class="auth-wrapper">
        <div class="auth-card">
            <h2 class="auth-title">Welcome Back 🍰</h2>
            <p class="auth-subtitle">Sign in to your Sweet Corner account</p>
            <form id="signin-form" class="auth-form">
                <div class="form-group"><label for="signin-email">Email Address</label><input type="email" id="signin-email" required placeholder="you@example.com"><span class="error-msg" id="email-error"></span></div>
                <div class="form-group"><label for="signin-password">Password</label><input type="password" id="signin-password" required placeholder="Enter your password"><span class="error-msg" id="pass-error"></span></div>
                <button type="submit" class="auth-btn">Sign In 🔐</button>
            </form>
            <p class="auth-footer">Don't have an account? <a href="signup.html" class="auth-link">Sign Up</a></p>
        </div>
    </main>
    <footer>
        <div class="footer-content"><p>&copy; 2026 Atlas Confections. Have questions? <a href="contact.html">Contact Our Team</a></p></div>
    </footer>
    <script>
        const form = document.getElementById('signin-form');
        const emailInput = document.getElementById('signin-email');
        const passInput = document.getElementById('signin-password');
        const emailError = document.getElementById('email-error');
        const passError = document.getElementById('pass-error');
        form.addEventListener('submit', (e) => {
            e.preventDefault(); let valid = true; emailError.textContent = ''; passError.textContent = '';
            const email = emailInput.value.trim(); const password = passInput.value;
            if (!email) { emailError.textContent = 'Email is required'; valid = false; }
            else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { emailError.textContent = 'Please enter a valid email'; valid = false; }
            if (!password) { passError.textContent = 'Password is required'; valid = false; }
            else if (password.length < 6) { passError.textContent = 'Password must be at least 6 characters'; valid = false; }
            if (!valid) return;
            const users = JSON.parse(localStorage.getItem('sweetUsers')) || [];
            const user = users.find(u => u.email === email && u.password === password);
            if (user) { localStorage.setItem('sweetCurrentUser', JSON.stringify({ name: user.name, email: user.email })); alert(`✅ Welcome back, ${user.name}! 🍰`); window.location.href = 'home.html'; }
            else { passError.textContent = 'Invalid email or password'; }
        });
        function toggleAuthNav() {
            const user = JSON.parse(localStorage.getItem('sweetCurrentUser')); const guestNav = document.getElementById('guest-nav'); const userNav = document.getElementById('user-nav'); const nameDisplay = document.getElementById('user-name-display');
            if (user) { guestNav.style.display = 'none'; userNav.style.display = 'flex'; nameDisplay.textContent = `👤 ${user.name}`; }
            else { guestNav.style.display = 'flex'; userNav.style.display = 'none'; }
        }
        function logout() { localStorage.removeItem('sweetCurrentUser'); window.location.reload(); }
        toggleAuthNav();
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const user = JSON.parse(localStorage.getItem('sweetCurrentUser'));
            const guestNav = document.getElementById('guest-nav');
            const userNav = document.getElementById('user-nav');
            const userDisplay = document.getElementById('user-display');
            const logoutBtn = document.getElementById('logout-trigger');

            if (user) {
                if (guestNav) guestNav.style.display = 'none';
                if (userNav) {
                    userNav.style.display = 'flex';
                    userDisplay.textContent = ` ${user.name}`;
                }
            } else {
                if (guestNav) guestNav.style.display = 'flex';
                if (userNav) userNav.style.display = 'none';
            }

            if (logoutBtn) {
                logoutBtn.addEventListener('click', function() {
                    localStorage.removeItem('sweetCurrentUser');
                    window.location.href = 'home.html';
                });
            }
        });
    </script>
</body>
</html>
